<title>Your ETF Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column that reads top to bottom: promise, explanation, numbers, plan, results, risk, income, action, questions */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1d2a26; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#1f6b52; --accent-soft:#e1efe8;
  --bank:#8a8f8c; --s5:#b07a1f; --s7:#1f8a5b; --s9:#2f6fb3; --warn:#a6561a; --warn-soft:#fbeee2; --down:#b5452f;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2320; --ink:#e6ece9; --muted:#9aa8a2; --line:#2c3833;
  --accent:#5cc79b; --accent-soft:#1f3a2f;
  --bank:#a2a8a5; --s5:#e0b25a; --s7:#4fc48e; --s9:#6aa6e8; --warn:#f0a868; --warn-soft:#3a2a1c; --down:#ef8a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2320; --ink:#e6ece9; --muted:#9aa8a2; --line:#2c3833;
  --accent:#5cc79b; --accent-soft:#1f3a2f;
  --bank:#a2a8a5; --s5:#e0b25a; --s7:#4fc48e; --s9:#6aa6e8; --warn:#f0a868; --warn-soft:#3a2a1c; --down:#ef8a72; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.9rem,6vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.2rem}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:14px}
.small{font-size:.92rem;color:var(--muted)}
.foot{font-size:.85rem;color:var(--muted);max-width:70ch}
.card-base{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.term{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}

/* header */
.brand{font-family:var(--display);font-size:1.15rem;color:var(--ink);letter-spacing:.01em}
.brand span{color:var(--accent)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 .8rem var(--body);letter-spacing:.06em;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.pill{align-self:flex-start;font-size:.8rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:8px}
.headline{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.headline p.big{font-size:1.2rem;line-height:1.45}
.headline strong{color:var(--accent)}

/* explainer */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.three b{display:block;font-size:1.02rem;margin-bottom:4px}

/* inputs */
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.field label{font-size:.9rem;color:var(--muted);font-weight:500}
.money{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line)}
.money:focus-within{border-color:var(--accent)}
.money span{font-size:1.3rem;color:var(--muted)}
.money input{border:0;background:transparent;color:var(--ink);font:600 1.5rem var(--body);width:100%;min-width:0;padding:2px 0;outline:none;font-variant-numeric:tabular-nums}

/* plan */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.step{display:flex;flex-direction:column;gap:6px}
.step .big{font-size:1.6rem;font-weight:700}
.step.wide{grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent)}
.monthly{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end}
.m-col{display:flex;flex-direction:column;gap:2px}
.m-lab{font-size:.9rem;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:600 1.25rem/1 var(--body);cursor:pointer}
.stepper button:hover{background:var(--accent);color:var(--surface)}
.stepper button:disabled{opacity:.35;cursor:default;background:var(--surface);color:var(--accent)}
.reset{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font:600 .88rem var(--body);text-decoration:underline;cursor:pointer}
.notice{background:var(--warn-soft);border-left:4px solid var(--warn);padding:12px 14px;border-radius:6px}

/* results */
.slider{display:flex;flex-direction:column;gap:6px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.slider-head strong{font-size:1.25rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.field input[type=range],.etf-range{height:28px;margin:2px 0 0;cursor:pointer}
.etf-range{margin-top:4px}
.ticks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.toggle{display:flex;align-items:flex-start;gap:8px;font-size:.95rem;cursor:pointer}
.toggle input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.feat{border-top:5px solid var(--s7);display:flex;flex-direction:column;gap:4px;padding:18px}
.feat .tag,.row .tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.feat .val{font-size:clamp(2rem,8vw,2.6rem);font-weight:700;line-height:1.1}
.feat .diff{font-weight:700;color:var(--s7);font-size:1.05rem}
.feat .tax{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.cmp{display:flex;flex-direction:column;padding:4px 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row:last-child{border-bottom:0}
.row .val{font-size:1.2rem;font-weight:700;text-align:right}
.row .sub{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.row .sub.loss{color:var(--down);font-weight:600}
.chart-box{padding:12px 8px 8px}
.chart-box svg{display:block;width:100%}
#chart{height:260px}
#ride{height:200px}

/* ride */
.ride-you{background:var(--warn-soft);border-left:4px solid var(--warn);padding:14px;border-radius:6px}

/* second salary */
.rule{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.rule-main{font-size:clamp(1.8rem,7vw,2.3rem);font-weight:700;color:var(--accent);line-height:1.1}
.rule-rows{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted)}

/* start */
.start{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.start li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.start li::before{content:counter(st);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:700}
.start li b{display:block}
.start li > div{padding-top:5px;min-width:0}

/* faq + glossary */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details + details{margin-top:-4px}
summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-weight:700;font-size:1.2rem;line-height:1}
details[open] summary::after{content:"−"}
details > div{padding:0 0 14px;color:var(--muted)}
.gloss{display:flex;flex-direction:column;gap:10px;margin:0}
.gloss dt{font-weight:700;color:var(--ink)}
.gloss dd{margin:0}
.gloss .hl{background:var(--accent-soft);border-radius:6px;padding:2px 4px;margin:-2px -4px}

/* support */
.support{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px}
.support > div{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 280px}
.coffee-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;background:var(--accent);color:var(--surface);font-weight:700;text-decoration:none;white-space:nowrap}
.coffee-btn:hover{filter:brightness(1.08)}
.disclaimer{font-size:.88rem;background:var(--warn-soft);border-left:4px solid var(--warn);padding:12px 14px;border-radius:6px}
/* feedback */
.fb-inline{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.fb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.fb-votes{display:flex;gap:8px}
.fb-vote{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:1.1rem;line-height:1;cursor:pointer}
.fb-vote:hover{border-color:var(--accent)}
.fb-vote[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fb-form{display:flex;flex-direction:column;gap:8px;position:relative}
.fb-form label{font-size:.9rem;color:var(--muted);font-weight:500}
.fb-form textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;background:var(--surface);color:var(--ink);resize:vertical}
.fb-form textarea:focus-visible,.fb-vote:focus-visible,.fb-send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb-send{align-self:flex-start;border:0;border-radius:999px;background:var(--accent);color:var(--surface);font:700 .95rem var(--body);padding:10px 20px;cursor:pointer}
.fb-send:disabled{opacity:.5;cursor:default}
.fb-thanks{font-weight:600;color:var(--accent)}
.fb-err{font-size:.88rem;color:var(--down)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<div class="wrap">

      hStart:`How to start this week`,
      st1:`<b>Open an account with a low-cost broker</b>A <a class="term" href="#g-broker">broker</a> is the app or bank where you buy and hold ETFs. Pick one that is regulated in your country and lets you set up a monthly investment plan. Check how ETF taxes work where you live.`,
      st2:`<b>Pick one world ETF</b>Look for one that follows the whole world stock market, is <a class="term" href="#g-acc">accumulating</a> and has a low yearly fee (<a class="term" href="#g-ter">TER</a>), ideally under 0.25%. If you want fewer ups and downs, an all-in-one ETF that also holds <a class="term" href="#g-bonds">bonds</a> is fine too.`,

  if(!DONATIONS){

  // Language. On youretfplan.com each language has its own URL (/ and /it/), set by a
  // <meta name="page-lang"> tag at build time. Without that tag (the claude.ai copy) the
  // page switches language in place.
  const pageLangMeta=document.querySelector('meta[name="page-lang"]');
  const FIXED=pageLangMeta?pageLangMeta.content:null;
  const URLS={en:'/',it:'/it/',es:'/es/'};
  function savedLang(){try{const s=localStorage.getItem('etf-plan-lang');if(s in URLS)return s}catch(e){}return null}
  function guessLang(){
    let tz='';
    try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
    if(['Europe/Rome','Europe/San_Marino','Europe/Vatican'].includes(tz))return 'it';
    if(['Europe/Madrid','Atlantic/Canary','Africa/Ceuta'].includes(tz))return 'es';
    const first=((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().slice(0,2);
    return first in URLS?first:'en';
  }
  // On the English page (/), send visitors to their saved language, or on a first visit to the language guessed from time zone / browser.
  if(FIXED==='en'&&!navigator.webdriver){const g=savedLang()||guessLang();if(g!=='en'){try{sessionStorage.setItem('etf-ref',document.referrer)}catch(e){}location.replace(URLS[g]+location.hash);return}}
  let lang=FIXED||savedLang()||guessLang(), L=T[lang], fmt, short, grp;

  function applyLang(){
    L=T[lang];
    document.documentElement.lang=lang;
    if(!FIXED)document.title=L.title;
    const nf=new Intl.NumberFormat(L.locale,{style:'currency',currency:'EUR',maximumFractionDigits:0});
    const gf=new Intl.NumberFormat(L.locale,{maximumFractionDigits:0});
    fmt=v=>nf.format(Math.round(v));
    grp=v=>gf.format(v);
    short=v=>v<=0?'€0':v>=1e6?'€'+(v/1e6).toLocaleString(L.locale,{maximumFractionDigits:1})+'M':'€'+Math.round(v/1000)+'k';
    document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=L[el.dataset.t]});
    document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',L[el.dataset.ta])});
    $('gloss').innerHTML=L.gloss.map(g=>'<div id="'+g[0]+'"><dt>'+g[1]+'</dt><dd>'+g[2]+'</dd></div>').join('');
    $('l-en').setAttribute('aria-pressed',lang==='en');
    $('l-it').setAttribute('aria-pressed',lang==='it');
    $('l-es').setAttribute('aria-pressed',lang==='es');
    ['income','spend','cash'].forEach(id=>{$(id).value=grp(num(id));$(id+'-r').value=sliderPos(id,num(id))});
    render();
  }
  function setLang(l){
    try{localStorage.setItem('etf-plan-lang',l)}catch(e){}

  let etfOverride=null, lastEtf=0;
  function num(id){const v=parseInt(String($(id).value).replace(/[^\d]/g,''),10);return isFinite(v)&&v>0?v:0}

  // Month-by-month simulation: emergency fund first, then the monthly split between ETFs and savings.
  function simulate(p,rate,years){
    const mr=Math.pow(1+rate,1/12)-1, E=p.spend*MONTHS;
    let bank=Math.min(p.cash,E), etf=0, extra=0, paid=p.cash;
    const lump=Math.max(0,p.cash-E);
    if(rate>0){etf=lump}else{bank+=lump}
    const pts=[bank+etf+extra], etfPts=[etf], paidPts=[paid];
    for(let m=1;m<=years*12;m++){
      etf*=1+mr;
      let s=p.surplus;
      if(s>0){
        paid+=s;
        if(rate===0){bank+=s}
        else{
          const gap=Math.max(0,E-bank), toE=Math.min(gap,s);
          bank+=toE; s-=toE;
          etf+=s*p.split; extra+=s*(1-p.split);
        }
      }
      if(m%12===0){pts.push(bank+etf+extra);etfPts.push(etf);paidPts.push(paid)}
    }
    return {pts,etfPts,paidPts,paid,etf};
  }

  function render(){
    const p={income:num('income'),spend:num('spend'),cash:num('cash')};
    p.surplus=p.income-p.spend;
    const pos=Math.max(0,p.surplus), suggested=Math.round(pos*0.75/10)*10;
    const etfM=etfOverride==null?suggested:Math.min(Math.max(etfOverride,0),pos);
    p.split=pos>0?etfM/pos:0;
    lastEtf=etfM;
    const er=$('etf-r'); er.max=Math.max(10,pos); er.value=etfM; er.disabled=pos<=0;
    $('etf-minus').disabled=pos<=0||etfM<=0;
    $('etf-plus').disabled=pos<=0||etfM>=pos;
    $('etf-reset').hidden=etfOverride==null||etfM===suggested;
    const years=+$('years').value, real=$('real').checked;
    $('years-out').textContent=L.years(years);

    // plan
    const E=p.spend*MONTHS, lump=Math.max(0,p.cash-E), gap=Math.max(0,E-p.cash);
    $('o-emerg').textContent=fmt(E);
    $('o-lump').textContent=fmt(lump);
    $('o-lump-txt').innerHTML=lump>0?L.lumpYes:L.lumpNo;
    $('o-etf').textContent=fmt(etfM);
    $('o-save').textContent=fmt(pos-etfM);
    const et=$('o-etf-txt');
    if(pos>0&&etfM>=pos){et.hidden=false;et.textContent=L.etfAll}
    else if(etfOverride!=null&&etfM!==suggested){et.hidden=false;et.textContent=L.etfOwn(fmt(suggested))}
    else et.hidden=true;
    const note=$('notice');
    if(p.surplus<=0){note.hidden=false;note.textContent=L.noSurplus}
    else if(gap>0){note.hidden=false;note.textContent=L.gap(fmt(gap),Math.ceil(gap/p.surplus))}
    else note.hidden=true;

    // results
    const defl=y=>real?Math.pow(1+INFL,y):1;
    const res=SCEN.map((s,i)=>({...s,name:L.scen[i][0],tag:L.scen[i][1],...simulate(p,s.rate,years)}));
    const val=s=>s.pts[years]/defl(years);
    const bank=res[0], main=res[MAIN], bankV=val(bank), mainV=val(main);

    // headline (always the 7% case vs the bank, in the same units as the results)
    $('headline').innerHTML=pos>0?L.headline(fmt(etfM),fmt(mainV-bankV),years):L.headlineNone;

    const gains=Math.max(0,main.pts[years]-main.paid);
    const afterTax=(main.pts[years]-gains*L.taxRate)/defl(years);
    $('feat').innerHTML='<span class="tag" style="--c:var(--s7)">'+main.tag+' · 7%</span>'+
      '<span class="val num">'+fmt(mainV)+'</span>'+
      '<span class="small">'+L.paidIn(fmt(main.paid))+'</span>'+
      '<span class="diff num">+'+L.vsBank(fmt(mainV-bankV))+'</span>'+
      '<span class="tax">'+L.afterTax(Math.round(L.taxRate*100)+'%',fmt(afterTax))+'</span>';

    const rows=[bank,res[1],res[3]].map(s=>{
      const v=val(s);
      let sub;
      if(s.rate===0) sub='<span class="sub loss">'+(real?L.bankReal(fmt(s.paid)):L.bankNom(fmt(s.pts[years]/Math.pow(1+INFL,years))))+'</span>';
      else sub='<span class="sub">'+L.paidIn(fmt(s.paid))+'</span>';
      return '<div class="row"><span><span class="tag" style="--c:var('+s.c+')">'+s.tag+'</span><br>'+s.name+(s.rate?'':' (0%)')+'</span>'+
        '<span class="val num">'+fmt(v)+'</span>'+sub+'</div>';
    });
    $('cmp').innerHTML=rows.join('');
    $('explain').textContent=real?L.explainReal(years,fmt(1000/Math.pow(1+INFL,years))):L.explainNom;

    // ride: what a 2008-style halving would look like on this person's account
    const ry=Math.min(10,years), etfAt=main.etfPts[ry];
    $('ride-you').innerHTML=etfAt>500?L.rideYou(ry,fmt(etfAt),fmt(etfAt/2)):L.rideYouNone;

    // second salary
    $('h-rule').textContent=L.ruleH(years);
    const mon=s=>(s.etf/defl(years))*0.03/12;
    $('rule-main').textContent=fmt(mon(main))+L.perMonth;
    $('rule-sub').textContent=L.ruleSub(fmt(main.etf/defl(years)));
    $('rule-rows').innerHTML=[res[1],res[3]].map(s=>'<span>'+L.ruleOther(s.tag+' '+Math.round(s.rate*100)+'%',fmt(mon(s)))+'</span>').join('');

    lastRes={res,years,defl};
    drawChart();
    drawRide();
  }
  let lastRes=null;

  const svgText=(x,y,anchor,s,fill,weight)=>'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anchor+'" font-size="12" font-weight="'+(weight||500)+'" fill="'+(fill||'var(--muted)')+'" font-family="Figtree,system-ui,sans-serif">'+s+'</text>';

  function drawChart(){
    if(!lastRes)return;
    const {res,years,defl}=lastRes;
    const box=$('chart-box'), W=Math.max(280,box.clientWidth-16), H=260; // fixed height: no layout shift when redrawn
    const Lp=48,R=86,Tp=14,B=28;
    const series=res.map(s=>s.pts.slice(0,years+1).map((v,i)=>v/defl(i)));
    const max=Math.max(...series.flat(),1);
    const step=niceStep(max/3), top=Math.ceil(max/step)*step;
    const x=i=>Lp+(W-Lp-R)*i/years, y=v=>Tp+(H-Tp-B)*(1-v/top);
    let g='';
    for(let v=0;v<=top+1e-6;v+=step){
      g+='<line x1="'+Lp+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
      g+=svgText(Lp-6,y(v)+4,'end',short(v));
    }
    const xs=years<=10?5:(years<=20?5:5);
    for(let i=0;i<=years;i+=xs)g+=svgText(x(i),H-8,'middle',i===0?L.today:i+L.yAbbr);
    if(years%xs!==0)g+=svgText(x(years),H-8,'middle',years+L.yAbbr);
    // main line area
    const mainPts=series[MAIN];
    g+='<path d="M'+x(0)+' '+y(0)+' '+mainPts.map((v,i)=>'L'+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')+' L'+x(years)+' '+y(0)+'Z" fill="var(--s7)" fill-opacity=".10"/>';
    series.forEach((pts,k)=>{
      const c='var('+res[k].c+')';
      const d=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
      g+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(k===MAIN?3:2)+'" stroke-linejoin="round"'+(k===0?' stroke-dasharray="5 4"':'')+'/>';
      g+='<circle cx="'+x(years).toFixed(1)+'" cy="'+y(pts[years]).toFixed(1)+'" r="'+(k===MAIN?4.5:3.5)+'" fill="'+c+'"/>';
    });
    // end labels, pushed apart so they never overlap
    const labs=res.map((s,k)=>({k,y:y(series[k][years]),t:(s.rate?Math.round(s.rate*100)+'%':'0%')+' '+short(series[k][years])})).sort((a,b)=>a.y-b.y);
    for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
    const over=labs[labs.length-1].y-(H-B);
    if(over>0)labs.forEach(l=>l.y-=over);
    labs.forEach(l=>{g+=svgText(x(years)+8,l.y+4,'start',l.t,'var('+res[l.k].c+')',l.k===MAIN?700:600)});
    const svg=$('chart'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.innerHTML=g;
  }

  // Illustrative path: steady growth, a 2008-style halving, recovery, a 2020-style dip, recovery.
  const RIDE=[100,106,113,120,126,104,78,63,74,88,98,108,117,126,135,143,151,159,166,173,181,186,190,198,207,138,172,205,220,236];
  function drawRide(){
    const box=$('ride-box'), W=Math.max(280,box.clientWidth-16), H=200;
    const Lp=12,R=12,Tp=22,B=16, n=RIDE.length-1, top=250, bot=40;
    const x=i=>Lp+(W-Lp-R)*i/n, y=v=>Tp+(H-Tp-B)*(1-(v-bot)/(top-bot));
    let g='';
    g+='<line x1="'+Lp+'" x2="'+(W-R)+'" y1="'+y(100).toFixed(1)+'" y2="'+y(100).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/>';
    g+=svgText(W-R,y(100)+16,'end',L.rideStart);
    // colour falling segments
    for(let i=1;i<=n;i++){
      const down=RIDE[i]<RIDE[i-1];
      g+='<line x1="'+x(i-1).toFixed(1)+'" y1="'+y(RIDE[i-1]).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y2="'+y(RIDE[i]).toFixed(1)+'" stroke="'+(down?'var(--down)':'var(--s7)')+'" stroke-width="3" stroke-linecap="round"/>';
    }
    const ann=(i,lab,dy)=>{g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(RIDE[i]).toFixed(1)+'" r="4" fill="var(--surface)" stroke="var(--down)" stroke-width="2"/>';g+=svgText(x(i),y(RIDE[i])+dy,'middle',lab,'var(--down)',700)};
    ann(7,'−50%',20);
    ann(25,'−33%',20);
    const svg=$('ride'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.innerHTML=g;
  }
  function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

  // Savings slider uses a curved scale (cube) from 0 to 10 million, so the low range
  // (a few thousand euros) stays precise. Other sliders are linear.
  const CASH_MAX=10000000;
  function cashFromPos(p){
    const v=CASH_MAX*Math.pow(p/1000,3);
    const step=v<10000?100:v<100000?1000:v<1000000?10000:100000;
    return Math.round(v/step)*step;
  }
  function posFromCash(v){return Math.round(1000*Math.cbrt(Math.min(v,CASH_MAX)/CASH_MAX))}
  function sliderVal(id,pos){return id==='cash'?cashFromPos(pos):pos}
  function sliderPos(id,v){return id==='cash'?posFromCash(v):v}

  // money inputs: digits only, shown with thousands separators
  ['income','spend','cash'].forEach(id=>{
    const el=$(id);
    el.addEventListener('input',()=>{
      const before=el.value.length, pos=el.selectionStart;
      const n=num(id); el.value=n?grp(n):'';
      const diff=el.value.length-before;
      try{el.setSelectionRange(Math.max(0,pos+diff),Math.max(0,pos+diff))}catch(e){}
      $(id+'-r').value=sliderPos(id,n);
      render();
    });
    el.addEventListener('blur',()=>{el.value=grp(num(id))});
    // slider: moves the number; typed values above the slider's max stay as typed
    $(id+'-r').addEventListener('input',e=>{el.value=grp(sliderVal(id,+e.target.value));render()});
  });
  $('etf-r').addEventListener('input',e=>{etfOverride=+e.target.value;render()});
  ['years','real'].forEach(id=>$(id).addEventListener('input',render));
  $('etf-plus').addEventListener('click',()=>{etfOverride=Math.floor(lastEtf/50)*50+50;render()});
  $('etf-minus').addEventListener('click',()=>{etfOverride=Math.ceil(lastEtf/50)*50-50;render()});
  $('etf-reset').addEventListener('click',()=>{etfOverride=null;render()});
  $('l-en').addEventListener('click',()=>setLang('en'));
  $('l-it').addEventListener('click',()=>setLang('it'));
  $('l-es').addEventListener('click',()=>setLang('es'));
  // glossary links open the glossary and highlight the word
  document.addEventListener('click',e=>{
    const a=e.target.closest('a.term'); if(!a)return;
    e.preventDefault();
    const id=a.getAttribute('href').slice(1);
    $('glossary').open=true;
    document.querySelectorAll('.gloss .hl').forEach(n=>n.classList.remove('hl'));

  });
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawChart();drawRide()},120)});
  // Anonymous usage events and feedback: only on youretfplan.com (not in the claude.ai copy,

  const TRACK=!!FIXED&&!navigator.webdriver;
  if(TRACK){['fb-result','fb-bottom','privacy'].forEach(id=>{$(id).hidden=false})}
  const sentSteps=new Set(), stepQueue=[]; let stepTimer;
  // After the language redirect the referrer is our own page, so use the one saved before redirecting.
  const SRC=(()=>{let r=document.referrer;try{const k=sessionStorage.getItem('etf-ref');if(k!==null){r=k;sessionStorage.removeItem('etf-ref')}}catch(e){}if(!r)return 'direct';try{const h=new URL(r).hostname.replace(/^www\./,'');if(h.endsWith('youretfplan.com'))return 'internal';if(/(^|\.)(google|bing|duckduckgo|yahoo|ecosia|qwant|brave|startpage)\./.test(h))return 'search:'+h;return h}catch(e){return 'other'}})();
  function flushSteps(){
    if(!stepQueue.length)return;
    const body=JSON.stringify({steps:stepQueue.splice(0),lang,source:SRC});
    try{if(!(navigator.sendBeacon&&navigator.sendBeacon('/api/e',body)))fetch('/api/e',{method:'POST',body,keepalive:true}).catch(()=>{})}catch(e){}
  }
  function track(step){
    if(!TRACK||sentSteps.has(step))return;
    sentSteps.add(step);stepQueue.push(step);
    clearTimeout(stepTimer);stepTimer=setTimeout(flushSteps,800);
  }
  if(TRACK){
    addEventListener('pagehide',flushSteps);
    track('view');
    if('IntersectionObserver' in window){
      const seen=[['numbers','calc_seen'],['start','start_seen'],['privacy','bottom']];
      const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const m=seen.find(x=>$(x[0])===e.target);if(m)track(m[1]);io.unobserve(e.target)}}),{threshold:.3});
      seen.forEach(([id])=>{const el=$(id);if(el)io.observe(el)});
    }
    ['income','spend','cash'].forEach(id=>{$(id).addEventListener('input',()=>track('active'));$(id+'-r').addEventListener('input',()=>track('active'))});
    $('etf-r').addEventListener('input',()=>track('explore'));
    ['years','real'].forEach(id=>$(id).addEventListener('input',()=>track('explore')));
    ['etf-plus','etf-minus','etf-reset'].forEach(id=>$(id).addEventListener('click',()=>track('explore')));
    document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)track('faq')}));
  }

  function postFeedback(data){
    return fetch('/api/f',{method:'POST',body:JSON.stringify(Object.assign({lang},data))})
      .then(r=>{if(!r.ok)throw new Error('status '+r.status)});
  }
  function wireForm(form,thanks,extra){
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const ta=form.querySelector('textarea'), btn=form.querySelector('.fb-send'), err=form.querySelector('.fb-err');
      const comment=ta.value.trim(); if(!comment){ta.focus();return}
      btn.disabled=true; err.hidden=true;
      postFeedback(Object.assign({comment,website:form.querySelector('.hp').value},extra()))
        .then(()=>{form.hidden=true;thanks.hidden=false})
        .catch(()=>{err.hidden=false})
        .finally(()=>{btn.disabled=false});
    });
  }
  let resultVote=null;
  const fbR=$('fb-result');
  fbR.querySelectorAll('.fb-vote').forEach(b=>b.addEventListener('click',()=>{
    if(resultVote!==null)return;
    resultVote=+b.dataset.vote;
    fbR.querySelectorAll('.fb-vote').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.disabled=true});
    postFeedback({place:'result',vote:resultVote}).catch(()=>{});
    $('fb-result-form').hidden=false;
    fbR.querySelector(':scope > .fb-thanks').hidden=false;
  }));
  wireForm($('fb-result-form'),fbR.querySelector(':scope > .fb-thanks'),()=>({place:'result_comment',vote:resultVote}));
  wireForm($('fb-bottom-form'),$('fb-bottom').querySelector(':scope > .fb-thanks'),()=>({place:'bottom'}));

  applyLang();
})();
</script>
