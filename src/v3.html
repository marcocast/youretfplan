<title>Your ETF Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Preview v3: a guided path with a clear finish line ("your first monthly plan in 10 minutes"),
   hand-drawn style illustrations, warm palette. 3 questions -> one-page plan. */
:root{
  --bg:#fbf6ec; --surface:#ffffff; --ink:#17322a; --muted:#5f6f68; --line:#e8dfcd;
  --accent:#1f6b52; --accent-ink:#ffffff; --sun:#ffc94a; --coral:#ff7a59; --mint:#cdeedb; --leaf:#3aa76d; --leaf2:#2b8a57; --sky:#e9f3ff; --bank:#a7aaa3;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10201a; --surface:#172a23; --ink:#eef3ef; --muted:#a3b3ab; --line:#2a3d35;
  --accent:#6fd3a5; --accent-ink:#10201a; --sun:#f2bd3f; --coral:#ff8f72; --mint:#21443a; --leaf:#58c48a; --leaf2:#3fa872; --sky:#1b3140; --bank:#7f8580; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10201a; --surface:#172a23; --ink:#eef3ef; --muted:#a3b3ab; --line:#2a3d35;
  --accent:#6fd3a5; --accent-ink:#10201a; --sun:#f2bd3f; --coral:#ff8f72; --mint:#21443a; --leaf:#58c48a; --leaf2:#3fa872; --sky:#1b3140; --bank:#7f8580; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2.3rem,10.5vw,3.3rem)}
h2{font-size:clamp(1.5rem,6.5vw,1.9rem)}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
button,a,input{-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
svg{display:block}
.ink{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
.brand span{color:var(--coral)}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;padding:2px;background:var(--surface);gap:2px}
.lang button{border:0;background:transparent;color:var(--ink);font:800 .75rem var(--body);letter-spacing:.06em;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:flex;flex-direction:column;gap:16px}
.badge{align-self:flex-start;background:var(--sun);color:#17322a;font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);transform:rotate(-2deg)}
.hero h1 em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);padding:0 2px}
.sub{font-size:1.08rem;color:var(--muted);max-width:52ch}
.ill-hero{width:100%;height:auto;max-height:260px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--ink);border-radius:16px;background:var(--accent);color:var(--accent-ink);font:800 1.1rem var(--body);padding:16px 22px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{font-size:.95rem;padding:11px 16px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.trust{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);font-weight:600}
.trust span::before{content:"✓ ";color:var(--leaf)}

/* what you get */
.get{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.get div{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:.88rem;line-height:1.25}
.get svg{width:56px;height:56px}

/* wizard */
.card{scroll-margin-top:12px;background:var(--surface);border:2px solid var(--ink);border-radius:22px;padding:20px 18px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:16px}
.progress{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line);border:0}
.dots i.on{background:var(--coral)}
.q{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center}
.q svg{width:92px;height:92px}
.q h2{font-size:clamp(1.35rem,6vw,1.7rem)}
.q p{color:var(--muted);font-size:.95rem;margin-top:6px}
.val{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,12vw,3.2rem);line-height:1;color:var(--accent);text-align:center}
input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--coral);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:-6px}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.back{border:0;background:none;color:var(--muted);font:700 .95rem var(--body);cursor:pointer;padding:8px 4px;text-decoration:underline}

/* result */
.plan-head{display:flex;flex-direction:column;gap:6px}
.plan-head .eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--bg);border:2px solid var(--line)}
.items svg{width:52px;height:52px}
.items b{display:block;font-size:1.02rem}
.items .amt{font-family:var(--display);font-weight:800;font-size:1.45rem;color:var(--accent);line-height:1.1;display:block;margin:2px 0}
.items p{color:var(--muted);font-size:.92rem}
.grow{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:8px;align-items:end;background:var(--sky);border-radius:18px;padding:16px;border:2px solid var(--ink)}
.grow svg{width:104px;height:122px}
.grow .lab{font-weight:700;color:var(--muted);font-size:.95rem}
.grow .big{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,10vw,2.8rem);line-height:1;margin:4px 0}
.grow .rng{font-size:.85rem;color:var(--muted)}
.grow .vs{font-size:.92rem;margin-top:8px;font-weight:600}
.grow .vs strong{color:var(--leaf2)}
.yrs{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.yrs button{flex:1;min-width:0;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 4px;font:800 .9rem var(--body);cursor:pointer}
.yrs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.honest{background:#fff3df;color:#5b3a12;border:2px dashed #c98a2b;border-radius:14px;padding:12px 14px;font-size:.92rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .honest{background:#33271a;color:#f3d7ac;border-color:#a87a36}}
:root[data-theme="dark"] .honest{background:#33271a;color:#f3d7ac;border-color:#a87a36}
.actions{display:flex;flex-direction:column;gap:12px}
.who{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:14px 16px}
.who svg{width:110px;height:84px}
.who h2{font-size:1.2rem;margin-bottom:4px}
.who p{color:var(--muted);font-size:.93rem}
.disc{font-size:.8rem;color:var(--muted)}

/* motion */
.tree-grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.float{animation:float 3.2s ease-in-out infinite}
.float2{animation:float 3.2s ease-in-out -1.6s infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tree-grow{transition:none}.pop,.float,.float2{animation:none}}
@media print{.top,.hero,.get,.who,.actions,.yrs,#wizard{display:none!important}.card{box-shadow:none}}
</style>

<!-- Reusable drawings -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-shield" viewBox="0 0 64 64"><path class="ink" d="M32 6 52 14v16c0 13-9 22-20 28C21 52 12 43 12 30V14Z" fill="var(--mint)"/><path class="ink" d="M23 32l6 6 12-13" fill="none"/></symbol>
    <symbol id="i-rocket" viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="var(--sun)" opacity=".45"/><path class="ink" d="M24 48c4-14 10-26 22-34-2 14-8 26-20 36Z" fill="var(--surface)"/><circle class="ink" cx="37" cy="27" r="4" fill="var(--sky)"/><path class="ink" d="M24 48l-8 4 4-8M18 40l-6-2 8-6M30 50l2 6 6-8" fill="var(--coral)"/></symbol>

    <symbol id="i-phone" viewBox="0 0 64 64"><rect class="ink" x="18" y="6" width="28" height="52" rx="6" fill="var(--surface)"/><path class="ink" d="M24 40l6-8 5 4 6-10" fill="none" stroke="var(--leaf)"/><path class="ink" d="M28 51h8"/></symbol>

<div class="wrap">
  <div class="top">
    <span class="brand">youretfplan<span>.com</span></span>
    <div class="lang" role="group" aria-label="Language / Lingua / Idioma">
      <button type="button" id="l-en" lang="en">EN</button>
      <button type="button" id="l-it" lang="it">IT</button>
      <button type="button" id="l-es" lang="es">ES</button>
    </div>
  </div>

  <section class="hero" aria-labelledby="h1">
    <span class="badge" data-t="badge"></span>
    <h1 id="h1" data-t="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <svg class="ill-hero" viewBox="0 0 360 230" role="img" data-ta="heroAlt">
      <ellipse cx="180" cy="212" rx="170" ry="16" fill="var(--mint)"/>
      <g class="float"><circle cx="312" cy="46" r="24" fill="var(--sun)" class="ink"/><path class="ink" d="M312 10v-6M312 88v-6M276 46h-6M354 46h-6M287 21l-4-4M341 75l-4-4M337 21l4-4M287 71l-4 4"/></g>
      <!-- calendar -->
      <g transform="rotate(-6 70 150)">
        <rect class="ink" x="36" y="118" width="70" height="66" rx="10" fill="var(--surface)"/>
        <rect x="38" y="120" width="66" height="14" rx="8" fill="var(--coral)"/><path class="ink" d="M36 134h70M54 110v14M88 110v14"/>
        <path d="M50 148h8M64 148h8M78 148h8M92 148h4M50 162h8M64 162h8" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
        <circle class="ink" cx="86" cy="166" r="9" fill="var(--sun)"/>
      </g>
      <!-- path of coins -->
      <path d="M112 150c22-20 40-28 62-24" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>
      <g class="float2"><circle class="ink" cx="140" cy="122" r="10" fill="var(--sun)"/><path d="M137 122h7M138 119h5M138 125h5" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></g>
      <!-- jar with tree -->
      <rect class="ink" x="180" y="120" width="96" height="88" rx="20" fill="var(--surface)"/>
      <rect class="ink" x="190" y="108" width="76" height="14" rx="6" fill="var(--coral)"/>
      <ellipse class="ink" cx="228" cy="196" rx="34" ry="7" fill="var(--sun)"/>
      <ellipse class="ink" cx="228" cy="186" rx="34" ry="7" fill="var(--sun)"/>
      <ellipse class="ink" cx="228" cy="176" rx="34" ry="7" fill="var(--sun)"/>
      <path class="ink" d="M228 170V64" fill="none" stroke-width="5"/>
      <path class="ink" d="M228 120c-14-6-22-16-24-28M228 100c14-4 22-12 26-24" fill="none" stroke-width="4"/>
      <circle class="ink" cx="228" cy="52" r="30" fill="var(--leaf)"/>
      <circle class="ink" cx="200" cy="86" r="18" fill="var(--leaf2)"/>
      <circle class="ink" cx="258" cy="72" r="20" fill="var(--leaf)"/>
      <circle cx="218" cy="44" r="5" fill="var(--sun)"/><circle cx="244" cy="62" r="5" fill="var(--coral)"/><circle cx="260" cy="70" r="4" fill="var(--sun)"/><circle cx="198" cy="84" r="4" fill="var(--coral)"/>
    </svg>
    <button type="button" class="btn" id="start"><span data-t="start"></span><span aria-hidden="true">→</span></button>
    <div class="trust"><span data-t="t1"></span><span data-t="t2"></span><span data-t="t3"></span></div>
  </section>

  <section aria-labelledby="h-get" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="h-get" data-t="getH" style="font-size:1.3rem"></h2>
    <div class="get">
      <div><svg><use href="#i-shield"/></svg><span data-t="g1"></span></div>
      <div><svg><use href="#i-cal"/></svg><span data-t="g2"></span></div>
      <div><svg><use href="#i-globe"/></svg><span data-t="g3"></span></div>
    </div>
  </section>

  <section class="who" aria-labelledby="h-who">
    <svg role="img" data-ta="whoAlt"><use href="#i-bros"/></svg>
    <div><h2 id="h-who" data-t="whoH"></h2><p data-t="who"></p></div>
  </section>

  <section id="wizard" class="card" aria-live="polite" tabindex="-1">
    <div class="progress"><span id="prog-txt"></span><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="q">
      <div><h2 id="q-h"></h2><p id="q-p"></p></div>
      <svg id="q-ill"><use href="#i-bag"/></svg>
    </div>
    <div class="val num" id="q-val"></div>
    <div>
      <input type="range" id="q-range" aria-labelledby="q-h">
      <div class="ticks num"><span id="tk-lo"></span><span id="tk-hi"></span></div>
    </div>
    <div class="nav">
      <button type="button" class="back" id="back" data-t="back"></button>
      <button type="button" class="btn small" id="next"><span id="next-txt"></span><span aria-hidden="true">→</span></button>
    </div>
  </section>

  <section id="result" class="card" hidden tabindex="-1" aria-labelledby="r-h">
    <div class="plan-head">
      <span class="eyebrow" data-t="rEyebrow"></span>
      <h2 id="r-h" data-t="rH"></h2>
    </div>
    <ul class="items" id="items"></ul>
    <div class="grow">
      <div>
        <div class="lab" id="g-lab"></div>
        <div class="big num" id="g-big"></div>
        <div class="rng num" id="g-rng"></div>
        <div class="vs num" id="g-vs"></div>
      </div>
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <ellipse cx="60" cy="132" rx="50" ry="7" fill="var(--mint)"/>
        <g class="tree-grow" id="tree">
          <path class="ink" d="M60 130V58" stroke-width="6"/>
          <path class="ink" d="M60 96c-10-4-16-12-18-20M60 82c10-3 16-9 19-18" fill="none" stroke-width="4"/>
          <circle class="ink" cx="60" cy="44" r="26" fill="var(--leaf)"/>
          <circle class="ink" cx="36" cy="70" r="15" fill="var(--leaf2)"/>
          <circle class="ink" cx="84" cy="62" r="16" fill="var(--leaf)"/>
          <g id="fruit"><circle cx="52" cy="36" r="4.5" fill="var(--sun)"/><circle cx="72" cy="50" r="4.5" fill="var(--coral)"/><circle cx="86" cy="60" r="4" fill="var(--sun)"/><circle cx="34" cy="68" r="4" fill="var(--coral)"/><circle cx="62" cy="24" r="4" fill="var(--coral)"/></g>
        </g>
      </svg>
      <div class="yrs" role="group" data-ta="yrsAria">
          <button type="button" data-y="5"></button><button type="button" data-y="10"></button><button type="button" data-y="20"></button>
      </div>
    </div>
    <p class="honest" data-t="honest"></p>
    <div class="actions">
      <a class="btn" id="full" href="/"><span data-t="full"></span><span aria-hidden="true">→</span></a>
      <button type="button" class="btn ghost small" id="print"><span data-t="print"></span></button>
      <button type="button" class="back" id="again" data-t="again" style="align-self:center"></button>
    </div>
  </section>

  <p class="disc" data-t="disc"></p>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const MONTHS=6;
  const T={
    en:{locale:'en-IE', full:'/#numbers',
      badge:'Free · 10 minutes', h1:'Your first <em>ETF plan</em>, in 10 minutes.',
      sub:'Answer 3 questions. You get a plan on one page: how much to keep in the bank, how much to invest each month, what to look for in an ETF and how to set it up.',
      heroAlt:'A calendar sends coins into a jar, and a tree grows out of it',
      start:'Make my plan', t1:'Free', t2:'No sign-up', t3:'No ads',
      getH:'At the end you’ll have', g1:'A safety cushion', g2:'A monthly amount', g3:'What to look for in an ETF',
      step:(i)=>`Question ${i} of 3`, next:'Next', last:'See my plan', back:'Back',
      qs:[
        {h:'How much do you spend a month?', p:'Rent, food, bills, everything. A rough number is fine.'},
        {h:'How much is in your bank account today?', p:'Savings you could use. Not counting what you need this month.'},
        {h:'How much can you put aside each month?', p:'What is usually left at the end of the month.'}],
      rEyebrow:'Your plan', rH:'Here’s what to do',
      keep:'Keep in the bank', keepP:'6 months of expenses, for surprises. It means you never have to sell your ETFs at a bad moment.',
      keepGap:(g,m)=>`You’re ${g} short: for the first ${m} ${m===1?'month':'months'} your savings go here, then the ETF starts.`,
      now:'Invest now', nowP:'What you have above the cushion. All at once, or spread over 6–12 months.',
      monthly:'Every month into an ETF', monthlyP:'Automatically, the day after payday. Like a subscription you don’t have to think about.',
      monthlyNone:'Nothing yet', monthlyNoneP:'First find a little room each month, even €50. Then come back here.',
      etf:'What to look for', etfAmt:'For example, a world ETF', etfP:'A common choice for beginners: thousands of companies worldwide, accumulating, yearly cost (TER) under 0.25%. It’s an example, not a recommendation: compare a few before you choose.',
      where:'Where', whereAmt:'A low-cost broker', whereP:'Regulated in your country, with an automatic monthly plan. Check how ETF taxes work where you live.',
      gLab:y=>`In ${y} years you could have`, gRng:(lo,hi)=>`Between ${lo} and ${hi}, depending on the markets (5–9% a year, 7% shown).`,
      gVs:(d)=>`That’s <strong>${d} more</strong> than leaving it in the bank.`,
      years:n=>`${n} years`, yrsAria:'Years',
      honest:'Honestly: some years will be red. In 2008 world markets roughly halved and came back within a few years. The plan works if you keep going.',
      full:'See every detail in the full calculator', print:'Save / print my plan', again:'Start again',
      whoH:'Made by Marco for his brother', who:'Marco is an engineer who invests in ETFs. He made this for his brother, and now it’s free for anyone: no ads, no affiliate links, no sign-up.', whoAlt:'Two brothers, one with an arm around the other',
      disc:'Educational estimates, not financial advice. Returns are not guaranteed; here they are constant averages before tax and fees. The bank is calculated at zero interest. Investing can lose money.'},
    it:{locale:'it-IT', full:'/it/#numbers',
      badge:'Gratis · 10 minuti', h1:'Il tuo primo <em>PAC in ETF</em>, in 10 minuti.',
      sub:'Rispondi a 3 domande. Alla fine hai il tuo piano su una pagina: quanto tenere in banca, quanto investire ogni mese, cosa cercare in un ETF e come impostarlo.',
      heroAlt:'Un calendario manda monete in un barattolo, da cui cresce un albero',
      start:'Crea il mio piano', t1:'Gratis', t2:'Senza registrazione', t3:'Senza pubblicità',
      getH:'Alla fine avrai', g1:'Un cuscinetto di sicurezza', g2:'Un importo mensile', g3:'Cosa cercare in un ETF',
      step:(i)=>`Domanda ${i} di 3`, next:'Avanti', last:'Vedi il mio piano', back:'Indietro',
      qs:[
        {h:'Quanto spendi al mese?', p:'Affitto, spesa, bollette, tutto. Va bene un numero indicativo.'},
        {h:'Quanti soldi hai in banca oggi?', p:'Risparmi che potresti usare. Senza contare quello che ti serve questo mese.'},
        {h:'Quanto riesci a mettere da parte ogni mese?', p:'Quello che di solito ti avanza a fine mese.'}],
      rEyebrow:'Il tuo piano', rH:'Ecco cosa fare',
      keep:'Tieni in banca', keepP:'6 mesi di spese, per gli imprevisti. Così non sei mai costretto a vendere gli ETF nel momento sbagliato.',
      keepGap:(g,m)=>`Ti mancano ${g}: ${m===1?'il primo mese':'per i primi '+m+' mesi'} il risparmio va qui, poi parte il PAC.`,
      now:'Investi subito', nowP:'Quello che hai oltre il cuscinetto. Tutto subito o in 6–12 rate.',
      monthly:'Ogni mese in ETF (PAC)', monthlyP:'In automatico, il giorno dopo lo stipendio. Come un abbonamento a cui non devi pensare.',
      monthlyNone:'Per ora niente', monthlyNoneP:'Prima trova un piccolo margine ogni mese, anche 50 €. Poi torna qui.',
      etf:'Cosa cercare', etfAmt:'Per esempio, un ETF mondiale', etfP:'Una scelta comune per chi inizia: migliaia di aziende in tutto il mondo, ad accumulazione, costo annuo (TER) sotto lo 0,25%. È un esempio, non un consiglio: confrontane qualcuno prima di scegliere.',
      where:'Dove', whereAmt:'Un broker a basso costo', whereP:'In regime amministrato, così le tasse le paga lui per te, e con il PAC mensile automatico.',
      gLab:y=>`Tra ${y} anni potresti avere`, gRng:(lo,hi)=>`Tra ${lo} e ${hi}, a seconda dei mercati (5–9% l’anno, qui il 7%).`,
      gVs:(d)=>`Cioè <strong>${d} in più</strong> che lasciarli in banca.`,
      years:n=>`${n} anni`, yrsAria:'Anni',
      honest:'Onestamente: ci saranno anni in rosso. Nel 2008 le borse mondiali si sono quasi dimezzate e si sono riprese in pochi anni. Il piano funziona se continui.',
      full:'Vedi tutti i dettagli nel calcolatore completo', print:'Salva / stampa il mio piano', again:'Ricomincia',
      whoH:'Fatto da Marco per suo fratello', who:'Marco è un ingegnere che investe in ETF. L’ha fatto per suo fratello, e ora è gratis per chiunque: senza pubblicità, senza link di affiliazione, senza registrazione.', whoAlt:'Due fratelli, uno abbraccia l’altro',
      disc:'Stime educative, non consulenza finanziaria. I rendimenti non sono garantiti; qui sono medie costanti prima di tasse e commissioni. La banca è calcolata a interesse zero. Investire comporta il rischio di perdere denaro.'},
    es:{locale:'es-ES', full:'/es/#numbers',
      badge:'Gratis · 10 minutos', h1:'Tu primer <em>plan en ETF</em>, en 10 minutos.',
      sub:'Responde 3 preguntas. Al final tienes tu plan en una página: cuánto dejar en el banco, cuánto invertir cada mes, qué buscar en un ETF y cómo programarlo.',
      heroAlt:'Un calendario envía monedas a un tarro, del que crece un árbol',
      start:'Crear mi plan', t1:'Gratis', t2:'Sin registro', t3:'Sin publicidad',
      getH:'Al final tendrás', g1:'Un colchón de seguridad', g2:'Un importe mensual', g3:'Qué buscar en un ETF',
      step:(i)=>`Pregunta ${i} de 3`, next:'Siguiente', last:'Ver mi plan', back:'Atrás',
      qs:[
        {h:'¿Cuánto gastas al mes?', p:'Alquiler, comida, facturas, todo. Vale un número aproximado.'},
        {h:'¿Cuánto dinero tienes en el banco hoy?', p:'Ahorros que podrías usar. Sin contar lo que necesitas este mes.'},
        {h:'¿Cuánto puedes ahorrar cada mes?', p:'Lo que normalmente te sobra a final de mes.'}],
      rEyebrow:'Tu plan', rH:'Esto es lo que tienes que hacer',
      keep:'Deja en el banco', keepP:'6 meses de gastos, para imprevistos. Así nunca tienes que vender tus ETF en un mal momento.',
      keepGap:(g,m)=>`Te faltan ${g}: ${m===1?'el primer mes':'durante los primeros '+m+' meses'} el ahorro va aquí y después empieza el ETF.`,
      now:'Invierte ya', nowP:'Lo que tienes por encima del colchón. Todo de golpe o repartido en 6–12 meses.',
      monthly:'Cada mes en un ETF', monthlyP:'De forma automática, el día después de cobrar. Como una suscripción en la que no tienes que pensar.',
      monthlyNone:'Por ahora nada', monthlyNoneP:'Primero busca un pequeño margen cada mes, aunque sean 50 €. Después vuelve aquí.',
      etf:'Qué buscar', etfAmt:'Por ejemplo, un ETF mundial', etfP:'Una opción habitual para empezar: miles de empresas de todo el mundo, de acumulación, coste anual (TER) por debajo del 0,25%. Es un ejemplo, no una recomendación: compara varios antes de elegir.',
      where:'Dónde', whereAmt:'Un bróker de bajo coste', whereP:'Regulado en España o en la UE, con aportaciones mensuales automáticas.',
      gLab:y=>`Dentro de ${y} años podrías tener`, gRng:(lo,hi)=>`Entre ${lo} y ${hi}, según los mercados (5–9% al año, aquí el 7%).`,
      gVs:(d)=>`Es decir, <strong>${d} más</strong> que dejarlo en el banco.`,
      years:n=>`${n} años`, yrsAria:'Años',
      honest:'Con sinceridad: habrá años en rojo. En 2008 las bolsas mundiales casi se redujeron a la mitad y se recuperaron en pocos años. El plan funciona si sigues.',
      full:'Ver todos los detalles en la calculadora completa', print:'Guardar / imprimir mi plan', again:'Empezar de nuevo',
      whoH:'Hecho por Marco para su hermano', who:'Marco es un ingeniero que invierte en ETF. Lo hizo para su hermano y ahora es gratis para cualquiera: sin publicidad, sin enlaces de afiliado, sin registro.', whoAlt:'Dos hermanos, uno abraza al otro',
      disc:'Estimaciones educativas, no asesoramiento financiero. Las rentabilidades no están garantizadas; aquí son medias constantes antes de impuestos y comisiones. El banco se calcula sin intereses. Invertir conlleva el riesgo de perder dinero.'}
  };
  // question sliders: spend, cash, monthly
  const Q=[
    {key:'spend', min:300, max:6000, step:50, val:1500, ill:'#i-bag'},
    {key:'cash',  min:0, max:100000, step:500, val:8000, ill:'#i-pig'},
    {key:'monthly', min:0, max:3000, step:25, val:300, ill:'#i-jar'}];
  const ans={spend:1500,cash:8000,monthly:300};
  let step=0, years=10;

  function guessLang(){
    try{const s=localStorage.getItem('etf-plan-lang');if(s in T)return s}catch(e){}
    let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
    if(['Europe/Rome','Europe/San_Marino','Europe/Vatican'].includes(tz))return 'it';
    if(['Europe/Madrid','Atlantic/Canary','Africa/Ceuta'].includes(tz))return 'es';
    const f=((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().slice(0,2);
    return f in T?f:'en';
  }
  let lang=guessLang(), L=T[lang], fmt;

  function showStep(focus){
    const q=Q[step], t=L.qs[step], r=$('q-range');
    $('prog-txt').textContent=L.step(step+1);
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<=step));
    $('q-h').textContent=t.h; $('q-p').textContent=t.p;
    $('q-ill').innerHTML='<use href="'+q.ill+'"/>';
    r.min=q.min; r.max=q.max; r.step=q.step; r.value=ans[q.key];
    $('tk-lo').textContent=fmt(q.min); $('tk-hi').textContent=fmt(q.max)+(q.key==='cash'?'+':'');
    $('q-val').textContent=fmt(ans[q.key]);
    $('back').style.visibility=step?'visible':'hidden';
    $('next-txt').textContent=step===2?L.last:L.next;
    if(focus){const w=$('wizard');w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');w.scrollIntoView({block:'start'});r.focus({preventScroll:true})}
  }

  // Month by month: cushion first, then the monthly amount goes into the ETF. Lump above the cushion invested at once.
  function simulate(rate,yrs){
    const mr=Math.pow(1+rate,1/12)-1, E=ans.spend*MONTHS;
    let bank=Math.min(ans.cash,E), etf=Math.max(0,ans.cash-E), paid=etf;
    for(let m=1;m<=yrs*12;m++){
      etf*=1+mr;
      let s=ans.monthly; const toE=Math.min(Math.max(0,E-bank),s); bank+=toE; s-=toE;
      etf+=s; paid+=s;
    }
    return {etf,paid};
  }

  function renderResult(){
    const E=ans.spend*MONTHS, gap=Math.max(0,E-ans.cash), lump=Math.max(0,ans.cash-E), m=ans.monthly;
    const li=(ic,t,amt,p)=>'<li><svg><use href="'+ic+'"/></svg><div><b>'+t+'</b><span class="amt num">'+amt+'</span><p>'+p+'</p></div></li>';
    let h=li('#i-shield',L.keep,fmt(E),gap>0&&m>0?L.keepGap(fmt(gap),Math.ceil(gap/m)):L.keepP);
    if(lump>0)h+=li('#i-rocket',L.now,fmt(lump),L.nowP);
    h+=m>0?li('#i-cal',L.monthly,fmt(m),L.monthlyP):li('#i-cal',L.monthly,L.monthlyNone,L.monthlyNoneP);
    h+=li('#i-globe',L.etf,L.etfAmt,L.etfP);
    h+=li('#i-phone',L.where,L.whereAmt,L.whereP);
    $('items').innerHTML=h;
    renderGrow();
  }
  function renderGrow(){
    const mid=simulate(.07,years), lo=simulate(.05,years), hi=simulate(.09,years);
    $('g-lab').textContent=L.gLab(years);
    $('g-big').textContent=fmt(mid.etf);
    $('g-rng').textContent=L.gRng(fmt(lo.etf),fmt(hi.etf));
    $('g-vs').innerHTML=mid.etf>mid.paid?L.gVs(fmt(mid.etf-mid.paid)):'';
    document.querySelectorAll('.yrs button').forEach(b=>{b.textContent=L.years(+b.dataset.y);b.setAttribute('aria-pressed',+b.dataset.y===years)});
    $('tree').style.transform='scale('+({5:.55,10:.78,20:1})[years]+')';
    $('fruit').style.opacity=years>=10?1:0;
  }

  function applyLang(){
    L=T[lang]; document.documentElement.lang=lang;
    const nf=new Intl.NumberFormat(L.locale,{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'});
    fmt=v=>nf.format(Math.round(v));
    document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=L[el.dataset.t]});
    document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',L[el.dataset.ta]));
    ['en','it','es'].forEach(k=>$('l-'+k).setAttribute('aria-pressed',k===lang));
    $('full').href=L.full;
    showStep(false);
    if(!$('result').hidden)renderResult();
  }

  $('q-range').addEventListener('input',e=>{ans[Q[step].key]=+e.target.value;$('q-val').textContent=fmt(ans[Q[step].key])});
  $('start').addEventListener('click',()=>{step=0;$('wizard').hidden=false;$('result').hidden=true;showStep(true)});
  $('next').addEventListener('click',()=>{
    if(step<2){step++;showStep(true);return}
    $('wizard').hidden=true; const r=$('result'); r.hidden=false; renderResult();
    r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');r.scrollIntoView({block:'start'});r.focus({preventScroll:true});
  });
  $('back').addEventListener('click',()=>{if(step>0){step--;showStep(true)}});
  $('again').addEventListener('click',()=>{step=0;$('result').hidden=true;$('wizard').hidden=false;showStep(true)});
  $('print').addEventListener('click',()=>window.print());
  document.querySelectorAll('.yrs button').forEach(b=>b.addEventListener('click',()=>{years=+b.dataset.y;renderGrow()}));
  ['en','it','es'].forEach(k=>$('l-'+k).addEventListener('click',()=>{lang=k;try{localStorage.setItem('etf-plan-lang',k)}catch(e){}applyLang()}));
  applyLang();
})();
</script>
